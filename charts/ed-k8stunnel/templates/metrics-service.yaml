{{- if .Values.metrics.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ed-k8stunnel.fullname" . }}-metrics
  labels:
    {{- include "ed-k8stunnel.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ed-k8stunnel.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ int .Values.ports.metrics }}
      targetPort: metrics
{{- end }}
