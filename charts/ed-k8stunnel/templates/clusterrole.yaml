{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ed-k8stunnel.fullname" . }}
  labels:
    {{- include "ed-k8stunnel.labels" . | nindent 4 }}
# Pod output redaction is best effort; command arguments, logs and arbitrary
# strings can still contain credentials. ConfigMap and log grants are configured
# separately in values.yaml and default off.
rules:
{{- if .Values.rbac.rules }}
  {{- toYaml .Values.rbac.rules | nindent 2 }}
{{- else }}
  - apiGroups: [""]
    resources:
      - pods
{{- if .Values.rbac.readPodLogs }}
      - pods/log
{{- end }}
      - pods/status
      - nodes
      - nodes/status
      - namespaces
      - services
      - endpoints
      - events
{{- if .Values.rbac.readConfigMaps }}
      - configmaps
{{- end }}
      - serviceaccounts
      - persistentvolumes
      - persistentvolumeclaims
      - replicationcontrollers
      - limitranges
      - resourcequotas
    verbs: [get, list]
  - apiGroups: [apps]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
      - controllerrevisions
    verbs: [get, list]
  - apiGroups: [batch]
    resources:
      - jobs
      - cronjobs
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources:
      - ingresses
      - networkpolicies
      - ingressclasses
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources:
      - horizontalpodautoscalers
    verbs: [get, list]
  - apiGroups: [policy]
    resources:
      - poddisruptionbudgets
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources:
      - storageclasses
      - csinodes
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources:
      - pods
      - nodes
    verbs: [get, list]
  - apiGroups: [events.k8s.io]
    resources:
      - events
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources:
      - customresourcedefinitions
    verbs: [get, list]
{{- end }}
{{- end }}
