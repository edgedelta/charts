---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ed-k8stunnel.stateSecretName" . }}
  labels:
    {{- include "ed-k8stunnel.labels" . | nindent 4 }}
type: Opaque
# No data on purpose: the agent fills it in after registering. Helm never
# writes data keys here, so upgrades cannot clobber what the agent persisted.
