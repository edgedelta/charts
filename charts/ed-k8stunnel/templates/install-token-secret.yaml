{{- if .Values.edgedelta.installToken }}
---
# Convenience path only: prefer installToken.existingSecret so the token
# never touches Helm release storage.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ed-k8stunnel.fullname" . }}-install-token
  labels:
    {{- include "ed-k8stunnel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.installToken.secretKey }}: {{ .Values.edgedelta.installToken | quote }}
{{- end }}
