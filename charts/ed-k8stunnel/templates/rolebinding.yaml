{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ed-k8stunnel.fullname" . }}-state
  labels:
    {{- include "ed-k8stunnel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ed-k8stunnel.fullname" . }}-state
subjects:
  - kind: ServiceAccount
    name: {{ include "ed-k8stunnel.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
