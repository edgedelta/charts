apiVersion: v2
name: ed-k8stunnel
description: >-
  Edge Delta's in-cluster Kubernetes tunnel agent: a kube-API shim behind an
  outbound-only Cloudflare Tunnel, capped at a read or operate
  (read plus a small write allowlist) ceiling. Outbound-only with mutual TLS end
  to end, no exec, no watch, and the RBAC reads no Secret but its own state.
type: application
version: 0.1.2
appVersion: "v0.1.2"
kubeVersion: '>=1.29.0-0'
