  serviceDNSSuffix: svc.cluster.local
  traceFiles: ""
  tolerations: {}
  nodeSelector: {}
  priorityClassName: ""
  updateStrategy:
    type: RollingUpdate
  goMemLimit: ""
  podSecurity:
    fsGroupChangePolicy: "OnRootMismatch"
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 300Mi
  # envs:
  # - name: XXX
  #   value: YYY
  # Configuration of HorizontalPodAutoscaler for compactor agents
