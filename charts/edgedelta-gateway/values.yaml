# Default values for edgedelta.

# Use either apiKey or secretApiKey.value but NOT both to provide API Key to Agent
apiKey: ""

secretApiKey:
  name: ""
  key: "ed-api-key"
  value: ""
  enable: false # set true when creating template from charts

# Predefined environment variables
# See: https://docs.edgedelta.com/helm-values/

storePort: ""
profilerPort: ""
promPort: ""
httpProxy: ""
httpsProxy: ""
noProxy: ""
edBackendDisabled: ""
edTagOverride: ""
edClusterName: ""
edSuppressionMode: ""
edSkipConfDownload: ""
edWorkflows: ""
edWorkflowPrefixes: ""
edDisableLeaderElection: ""
edTraceFiles: ""
edAggregatorTraceFiles: ""
edSkipTlsVerify: ""
edConfigContent: ""
goMemLimit: ""

edEnableControllerDiscovery: true

# RBAC configuration
rbac:
  # rbac.scope -- Scope of the RBAC resources created for the EdgeDelta gateway. Supported values are cluster and namespace.
  # cluster creates a ClusterRole and ClusterRoleBinding from clusterRoleRules below.
  # namespace creates a Role and RoleBinding in the release namespace from roleRules below.
  scope: cluster

# clusterRoleRules -- RBAC rules of the ClusterRole created when rbac.scope is cluster.
# Customize these rules to match your cluster's security requirements.
# Each rule optionally accepts resourceNames to restrict it to specific named resources.
# @default -- see the clusterRoleRules list in values.yaml
clusterRoleRules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - pods/log
      - events
      - nodes
      - nodes/metrics
      - services
      - endpoints
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["watch", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["watch", "list"]

# Example:
# additionalClusterRoleRules:
#   - apiGroups: ["argoproj.io"]
#     resources: ["applications", "appprojects"]
#     verbs: ["get", "list", "watch"]
#   - apiGroups: ["argoproj.io"]
#     resources: ["appprojects"]
#     resourceNames: ["default"]
#     verbs: ["get"]

# additionalClusterRoleRules -- ClusterRole rules added to clusterRoleRules, for custom resources
# such as ArgoCD or Prometheus Operator CRDs. Each rule optionally accepts resourceNames to
# restrict it to specific named resources. See the example above.
additionalClusterRoleRules: []

# roleRules -- RBAC rules of the Role created when rbac.scope is namespace. A Role cannot grant
# access to cluster-scoped resources, so node level metrics and cluster wide discovery are not
# available with namespace scope. Each rule optionally accepts resourceNames to restrict it to
# specific named resources.
# @default -- see the roleRules list in values.yaml
roleRules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - services
      - endpoints
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["watch", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["watch", "list"]

# Example:
# additionalRoleRules:
#   - apiGroups: ["argoproj.io"]
#     resources: ["applications", "appprojects"]
#     verbs: ["get", "list", "watch"]
#   - apiGroups: ["argoproj.io"]
#     resources: ["appprojects"]
#     resourceNames: ["default"]
#     verbs: ["get"]

# additionalRoleRules -- Role rules added to roleRules, for namespaced custom resources. Each rule
# optionally accepts resourceNames to restrict it to specific named resources. See the example above.
additionalRoleRules: []

# skipping adding common labels for helm charts into direct helm to k8s yaml file creation.
skipCommonLabels: false

# custom tags are pipe separated key:val pairs. these are going to be attached to all outgoing data from agent to configured destination(s).
edCustomTags: ""

# Volume props will be used for mounting certain volume(s) to the given path(s) for the agent
# volumeProps:
#   volumeMounts:
#     - mountPath: /var/lib/kubelet
#       name: varlibkubelet
#       readOnly: true
#   volumes:
#     - hostPath:
#         path: /var/lib/kubelet
#         type: ""
#       name: varlibkubelet

# Watcher properties
# Watcher is deployed as a sidecar container to monitor the main agent's health
# It watches for issues like OOM kills, crash loops, evictions, and scheduling failures
watcherProps:
  enabled: false
  # Target container name to monitor (defaults to main agent container)
  # Empty string means auto-detect using chart name
  targetContainerName: ""
  # Check interval for monitoring (e.g., "30s", "1m")
  # Empty string uses watcher default (30s)
  checkInterval: ""
  # Resource constraints for watcher sidecar
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Custom labels:

# labels:
#   sample-label-key: sample-label-value

# Custom environment variables:

# envs:
#  - name: sample-var
#    value: sample-value

# Custom secret environment variables:
# Use only lowercase alphabetic and - characters in secretKeyRef name and key fields, otherwise helm deploys the release but throws an obscure error about DNS-1123 subdomain format

# secrets:
#  - name: sampleSecretVar
#    secretKeyRef:
#      name: sample-k8-secret-name
#      key: sample-k8s-secret-subkey

# Create secrets with below command:
# kubectl create secret generic sample-k8-secret-name --namespace=edgedelta --from-literal=sample-k8s-secret-subkey="SECRET_VALUE"

# Configuration of deployment type for processor agents
deployment:
  # deployment.replicas -- Number of pods of the deployment. Mutually exclusive with autoscaling
  replicas: 2
  # Configuration of HorizontalPodAutoscaler for processor agents
  autoscaling:
    # deployment.autoscaling.enabled -- Create a [HorizontalPodAutoscaler](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/) for processor agents
    enabled: false
    # deployment.autoscaling.external -- Set to `true` if using an external autoscaler like [KEDA](https://keda.sh/)
    external: false
    # deployment.autoscaling.minReplicas -- Minimum replica count for rollup agents
    minReplicas: 1
    # deployment.autoscaling.maxReplicas -- Maximum replica count for rollup agents
    maxReplicas: 10
    # deployment.autoscaling.targetForCPUUtilizationPercentage -- Targeted CPU utilization for rollup agents in order to HPA to kick in
    targetForCPUUtilizationPercentage: 85
    # deployment.autoscaling.targetForMemoryUtilizationPercentage -- Targeted Memory utilization for rollup agents in order to HPA to kick in
    targetForMemoryUtilizationPercentage:
    # deployment.autoscaling.customMetric -- For any custom metrics for targeting, one can use this section
    customMetric:
      {}
      #  - type: Pods
      #    pods:
      #      metric:
      #        name: packets-per-second
      #      target:
      #        type: AverageValue
      #        averageValue: 1k
    # deployment.autoscaling.behavior -- Configure separate scale-up and scale-down behaviors
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60 # Slower scale-up
        policies:
          - type: Percent
            value: 50 # Scale up by 50% max
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
  # deployment.topologySpreadConstraints -- Topology spread constraints for processor agents while in Deployment mode
  topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       edgedelta/agent-type: processor
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  lifecycle: {}
  terminationGracePeriodSeconds: 10
  # deployment.podDisruptionBudget -- Set exactly one of minAvailable or maxUnavailable.
  podDisruptionBudget:
    enabled: false
    minAvailable:
    maxUnavailable:

# Resource constraints
annotations: {}
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 256Mi

tolerations: {}
nodeSelector: {}
priorityClassName: ""

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

coordinatorProps:
  enabled: true
  endpoint: ""

# ports will define which extra ports should be exposed in order to send data to agents
ports: []
# example configuration can be found below:
# ports:
# - name: port-1
#   protocol: TCP
#   port: 80
# - name: port-2
#   protocol: UDP
#   port: 5000

# Helm overrides
repository: gcr.io/edgedelta
image:
  name: agent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Overrides full image (with url and version/tag) if not empty
  # example: gcr.io/edgedelta/agent@sha256:0180ff40f52528d7462200c40fae8aff3bdb83289ac19ce823a3fcb1c40c9ad9
  fullPath: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# nameOverride -- Override the name of resources.
nameOverride: ""
# fullnameOverride -- Override the full name of resources.
fullnameOverride: ""

# networkPolicy -- Manage NetworkPolicy
networkPolicy:
  # networkPolicy.enabled -- If true, create NetworkPolicy for DaemonSet
  enabled: false
  # networkPolicy.type -- Type of the network policy to use.
  # Can be:
  # * cilium     for cilium.io/v2/CiliumNetworkPolicy
  type: cilium
  cilium:
    # networkPolicy.cilium.dnsSelector -- Cilium selector of the DNS server entity
    # @default -- kube-dns in namespace kube-system
    dnsSelector:
      toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns

    # networkPolicy.cilium.customEndpoints -- Custom endpoint addresses for egress traffic
    #
    # customEndpoints:
    #   toFQDNs:
    #     - matchName: "api.edgedelta.com"
    #     - matchPattern: "*.s3.us-east-1.amazonaws.com"
    #   toCIDR:
    #     - 192.168.1.0/24
    #   toServices:
    #     - k8sService:
    #         namespace: default
    #         serviceName: customservice
    #   toPorts:
    #     - ports:
    #         - port: "443"
    #           protocol: TCP

# serviceMonitor -- it will be used enable prometheus to scrape metrics from processor agents
serviceMonitor:
  # serviceMonitor.enabled -- If true, create ServiceMonitor for processor agents
  enabled: false
  #   namespace: monitoring
  #   scrapeTimeout: 10s
  #   jobLabel: edgedelta
  #   selector:
  #     release: prom-kube-stack

instructionURL: "https://app.edgedelta.com"

